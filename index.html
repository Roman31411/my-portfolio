<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моё портфолио</title>
    <style>
        body { background: #fff; color: #000; font-family: sans-serif; transition: 0.3s; }
        .dark-theme { background: #222; color: #fff; }

        .projects-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            border: 2px solid #ccc;
            padding: 20px;
            width: 100px;
            transition: transform 0.2s; 
        }

        .card:hover {
            transform: scale(1.05); 
        }
    </style>
</head>
<body>

    <button id="themeBtn">Сменить тему</button>

    <h1>Иван Разработчик</h1>
    <p>Создаю простые и понятные сайты на HTML, CSS и JavaScript.</p>

    <h2>Навыки:</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
		<li>Git и GitHub</li>
    </ul>

    <h2>Учебные проекты:</h2>
    <div class="projects-container">
        <div class="card">
            <h3>Проект 1</h3>
            <p>Описание первого учебного проекта.</p>
        </div>
        <div class="card">
            <h3>Проект 2</h3>
            <p>Описание второго учебного проекта.</p>
        </div>
		<div class="card"> 
            <h3>Проект 3</h3>
            <p>Описание третьего учебного проекта.</p>
        </div>
    </div>

    <script>
        const btn = document.getElementById('themeBtn');
        btn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
        });
    </script>

</body>
</html>
